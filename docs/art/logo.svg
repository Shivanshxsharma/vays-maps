<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="96" height="96" role="img" aria-label="Vays Maps logo">
  <title>Vays Maps</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#224F10"/>
      <stop offset="0.55" stop-color="#143008"/>
      <stop offset="1" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="take" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAFFD0"/>
      <stop offset="1" stop-color="#B0E454"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="26" fill="url(#tile)"/>
  <rect width="100" height="100" rx="26" fill="url(#shine)"/>
  <rect x="0.6" y="0.6" width="98.8" height="98.8" rx="25.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.2"/>
  <!-- the road you skip: outline -->
  <path d="M50 78 C50 62 34 52 31 26" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="11" stroke-linecap="round"/>
  <path d="M50 78 C50 62 34 52 31 26" fill="none" stroke="#143008" stroke-width="6.8" stroke-linecap="round"/>
  <!-- the road you take: solid, with a soft glow and an arrow -->
  <path d="M50 78 C50 62 66 52 69 30" fill="none" stroke="#B0E454" stroke-opacity="0.4" stroke-width="19" stroke-linecap="round"/>
  <path d="M50 78 C50 62 66 52 69 30" fill="none" stroke="url(#take)" stroke-width="11" stroke-linecap="round"/>
  <path d="M70.5 18 L80.5 33 L61 31 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
</svg>
